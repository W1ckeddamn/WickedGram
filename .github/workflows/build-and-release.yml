name: Build and Release WickedGram

on:
  push:
    branches:
      - dev
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'changelog.txt'
      - 'LEGAL'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Configuration'
        required: true
        default: 'Debug'
        type: choice
        options:
          - Release
          - Debug

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-2022
    timeout-minutes: 360

    env:
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"

    defaults:
      run:
        shell: cmd

    steps:
      - name: Prepare build directories
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Get repository name
        shell: bash
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}
          fetch-depth: 0

      - name: Setup Environment
        shell: bash
        run: |
          DOCPATH=$TBUILD/$REPO_NAME/docs/building-win.md
          SDK="$(grep "SDK version" $DOCPATH | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> $GITHUB_ENV

          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake || true

          echo "$(sha256sum $TBUILD/$REPO_NAME/$PREPARE_PATH | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

          git config --global user.email "ci@wickedgram.local"
          git config --global user.name "WickedGram CI"

      - name: Setup MSVC Native Tools
        uses: Eden-CI/msvc-dev-cmd@master
        with:
          arch: x64
          sdk: ${{ env.SDK }}
          toolset: '14.44'

      - name: Configure NuGet
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: Restore ThirdParty cache
        id: cache-third-party
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-${{ runner.arch }}-third-party-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ runner.arch }}-third-party-

      - name: Restore Libraries cache
        id: cache-libs
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-libs-v3-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-x64-libs-v3-

      - name: Restore Qt cache
        id: cache-qt
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-qt-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-x64-qt-

      - name: Determine Build Configuration
        id: config
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]] || [[ "${{ inputs.build_type }}" == "Release" ]]; then
            echo "build_config=Release" >> $GITHUB_OUTPUT
            echo "skip_release=" >> $GITHUB_OUTPUT
            echo "is_release=true" >> $GITHUB_OUTPUT
          else
            echo "build_config=Debug" >> $GITHUB_OUTPUT
            echo "skip_release=skip-release" >> $GITHUB_OUTPUT
            echo "is_release=false" >> $GITHUB_OUTPUT
          fi

      - name: Prepare Libraries
        run: |
          %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat ${{ steps.config.outputs.skip_release }} silent

      - name: Prune library build artifacts for cache quota
        shell: bash
        run: |
          find $LibrariesPath '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -path '*/nv-codec-headers/*' -o -path '*/src/wallet_engine/*' -o '(' '(' -path '*/tlottie/*' -o -path '*/wallet-engine/*' ')' ! -path '*/target/*' ')' ')' -type f ')' -o '(' -empty ! -path '*/tlottie/*' ! -path '*/wallet-engine/*' ')' ')' -delete

      - name: Verify wallet_engine artifacts
        shell: bash
        run: |
          WALLET_CPP="$LibrariesPath/tdesktop_rust/out/src/wallet_engine/wallet_engine.cpp"
          if [ ! -f "$WALLET_CPP" ]; then
            echo "::warning::wallet_engine.cpp missing at $WALLET_CPP, rebuilding tdesktop_rust..."
            rm -f "$LibrariesPath/cache_keys/tdesktop_rust"
            cmd.exe /c "%TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat ${{ steps.config.outputs.skip_release }} silent"
          fi
          if [ -f "$WALLET_CPP" ]; then
            echo "wallet_engine.cpp is present: $(ls -lh "$WALLET_CPP")"
          else
            echo "::error::wallet_engine.cpp still missing after rebuild!"
          fi

      - name: Save ThirdParty cache immediately
        if: steps.cache-third-party.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-${{ runner.arch }}-third-party-${{ env.CACHE_KEY }}

      - name: Save Qt cache immediately
        if: steps.cache-qt.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-qt-${{ env.CACHE_KEY }}

      - name: Save Libraries cache immediately
        if: steps.cache-libs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-libs-v3-${{ env.CACHE_KEY }}

      - name: Set WickedGram update counter
        shell: bash
        run: |
          echo "WICKEDGRAM_BUILD_COUNTER=$((GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))" >> "$GITHUB_ENV"

      - name: Configure CMake and Build
        run: |
          cd %TBUILD%\%REPO_NAME%\Telegram
          
          set "API_CONFIG=-D TDESKTOP_API_ID=611335 -D TDESKTOP_API_HASH=d524b414d21f4d37f08684c1df41ac9c"
          if not "${{ secrets.TDESKTOP_API_ID }}"=="" (
            set "API_CONFIG=-D TDESKTOP_API_ID=${{ secrets.TDESKTOP_API_ID }} -D TDESKTOP_API_HASH=${{ secrets.TDESKTOP_API_HASH }}"
          )

          call configure.bat x64 %API_CONFIG% ^
            -D CMAKE_CONFIGURATION_TYPES=${{ steps.config.outputs.build_config }} ^
            -D CMAKE_COMPILE_WARNING_AS_ERROR=OFF ^
            -D DESKTOP_APP_DISABLE_AUTOUPDATE=OFF ^
            -D TDESKTOP_UPDATE_CHANNEL=canary-public ^
            -D TDESKTOP_CANARY_COUNTER=%WICKEDGRAM_BUILD_COUNTER% ^
            -D TDESKTOP_BUILD_UPDATE_TESTS=ON ^
            -D DESKTOP_APP_DISABLE_CRASH_REPORTS=OFF

          cmake --build ..\out --config ${{ steps.config.outputs.build_config }} --parallel

      - name: Verify update trust and rejection rules
        run: |
          %TBUILD%\%REPO_NAME%\out\${{ steps.config.outputs.build_config }}\test_update_verify.exe
          if errorlevel 1 exit /b 1
          %TBUILD%\%REPO_NAME%\out\${{ steps.config.outputs.build_config }}\test_update_unpack.exe
          if errorlevel 1 exit /b 1
          %TBUILD%\%REPO_NAME%\out\${{ steps.config.outputs.build_config }}\test_updater_win.exe

      - name: Create signed WickedGram update
        if: github.ref == 'refs/heads/dev' && github.event_name != 'pull_request'
        shell: pwsh
        env:
          SIGNING_KEY: ${{ secrets.WICKEDGRAM_UPDATE_SIGNING_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_KEY)) {
            throw 'WICKEDGRAM_UPDATE_SIGNING_KEY is required to publish updates'
          }
          $out = Join-Path $env:TBUILD "$env:REPO_NAME/out/${{ steps.config.outputs.build_config }}"
          $stage = Join-Path $env:RUNNER_TEMP 'wickedgram-update-stage'
          $keyPath = Join-Path $env:RUNNER_TEMP 'wickedgram-signing.pem'
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          New-Item -ItemType Directory -Force -Path $stage, $dist | Out-Null
          Copy-Item -LiteralPath "$out/Telegram.exe", "$out/Updater.exe" -Destination $stage
          if (Test-Path -LiteralPath "$out/agent.exe") {
            Copy-Item -LiteralPath "$out/agent.exe" -Destination $stage
          }
          $versionHeader = Get-Content "$env:TBUILD/$env:REPO_NAME/Telegram/SourceFiles/core/version.h" -Raw
          $baseVersion = [regex]::Match($versionHeader, 'AppVersion = (\d+);').Groups[1].Value
          if (-not $baseVersion) { throw 'AppVersion not found' }
          [IO.File]::WriteAllText($keyPath, $env:SIGNING_KEY, [Text.UTF8Encoding]::new($false))
          $env:SIGNING_KEY = ''
          Push-Location $dist
          try {
            $paths = @('-path', "$stage/Telegram.exe", '-path', "$stage/Updater.exe")
            if (Test-Path -LiteralPath "$stage/agent.exe") { $paths += @('-path', "$stage/agent.exe") }
            & "$out/Packer.exe" @paths -version $baseVersion -target win64 -channel canary-public -counter $env:WICKEDGRAM_BUILD_COUNTER -keys-loc "$env:TBUILD/$env:REPO_NAME/Telegram/Resources/update" -local-key $keyPath -local-key-id wickedgram-dev-1
            if ($LASTEXITCODE -ne 0) { throw 'Signed update packing or verification failed' }
            $package = "td-update-win-x64-$baseVersion-canary-$env:WICKEDGRAM_BUILD_COUNTER"
            if (-not (Test-Path -LiteralPath $package)) { throw 'Update package missing' }
            $feed = @{ app = 'WickedGram'; target = 'win64'; base = [int]$baseVersion; counter = [int]$env:WICKEDGRAM_BUILD_COUNTER }
            [IO.File]::WriteAllText((Join-Path $dist 'update.json'), ($feed | ConvertTo-Json -Compress), [Text.UTF8Encoding]::new($false))
          } finally {
            Pop-Location
            Remove-Item -LiteralPath $keyPath -Force
          }

      - name: Package WickedGram
        id: package
        shell: bash
        run: |
          CONFIG="${{ steps.config.outputs.build_config }}"
          OUT_DIR="$TBUILD/$REPO_NAME/out/$CONFIG"
          
          echo "Checking build output in $OUT_DIR..."
          if [ ! -f "$OUT_DIR/Telegram.exe" ]; then
            echo "Error: Telegram.exe not found in $OUT_DIR!" >&2
            ls -la "$OUT_DIR" || true
            exit 1
          fi

          VERSION="${{ github.ref_name }}"
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            DIST_NAME="WickedGram-${VERSION}-Windows-x64"
          else
            DIST_NAME="WickedGram-${VERSION}-${SHORT_SHA}-Windows-x64"
          fi

          DIST_DIR="$GITHUB_WORKSPACE/dist/$DIST_NAME"
          mkdir -p "$DIST_DIR"

          cp "$OUT_DIR/Telegram.exe" "$DIST_DIR/WickedGram.exe"
          if [ -f "$OUT_DIR/Updater.exe" ]; then
            cp "$OUT_DIR/Updater.exe" "$DIST_DIR/Updater.exe"
          fi
          # Bundle native C++ AI Agent CLI
          if [ -f "$OUT_DIR/agent.exe" ]; then
            cp "$OUT_DIR/agent.exe" "$DIST_DIR/agent.exe"
          fi

          # Bundle Agent skill for AI assistants (Antigravity, Claude Code, Cursor)
          mkdir -p "$DIST_DIR/.agents/skills/wickedgram-agent-bridge"
          cp "$TBUILD/$REPO_NAME/.agents/skills/wickedgram-agent-bridge/SKILL.md" "$DIST_DIR/.agents/skills/wickedgram-agent-bridge/"

          shopt -s dotglob
          cd "$DIST_DIR"
          7z a -tzip "$GITHUB_WORKSPACE/dist/${DIST_NAME}.zip" *

          ZIP_PATH="$GITHUB_WORKSPACE/dist/${DIST_NAME}.zip"
          ZIP_NAME="${DIST_NAME}.zip"
          SHA256=$(sha256sum "$ZIP_PATH" | awk '{print $1}')

          echo "zip_path=$ZIP_PATH" >> $GITHUB_OUTPUT
          echo "zip_name=$ZIP_NAME" >> $GITHUB_OUTPUT
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT

      - name: Upload Build Artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.zip_name }}
          path: ${{ steps.package.outputs.zip_path }}
          retention-days: 14

      - name: Publish WickedGram development update
        if: github.ref == 'refs/heads/dev' && github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = $env:GITHUB_REPOSITORY
          $tag = "dev-build-$env:WICKEDGRAM_BUILD_COUNTER"
          $packages = @(Get-ChildItem "$env:GITHUB_WORKSPACE/dist/td-update-win-x64-*-canary-$env:WICKEDGRAM_BUILD_COUNTER")
          if ($packages.Count -ne 1) { throw 'Expected exactly one signed update' }
          gh release create $tag $packages[0].FullName '${{ steps.package.outputs.zip_path }}' --repo $repo --target $env:GITHUB_SHA --prerelease --title "WickedGram dev #$env:WICKEDGRAM_BUILD_COUNTER" --notes 'Signed Windows x64 development update.'
          if ($LASTEXITCODE -ne 0) { throw 'Update release publication failed' }
          gh release view wickedgram-dev --repo $repo *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create wickedgram-dev --repo $repo --target $env:GITHUB_SHA --prerelease --title 'WickedGram development update feed' --notes 'Metadata for automatic development updates.'
            if ($LASTEXITCODE -ne 0) { throw 'Update feed release creation failed' }
          }
          gh release upload wickedgram-dev "$env:GITHUB_WORKSPACE/dist/update.json" --repo $repo --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Update feed publication failed' }

      - name: Create GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.zip_path }}
          name: WickedGram ${{ github.ref_name }}
          body: |
            ## WickedGram ${{ github.ref_name }}
            
            ### Windows (x64)
            * **Archive:** `${{ steps.package.outputs.zip_name }}`
            * **SHA-256:** `${{ steps.package.outputs.sha256 }}`
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
